name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install pinned clang-format
        run: pip install "clang-format==18.1.8"   # keep in lockstep with requirements-dev.txt
      - name: clang-format --dry-run -Werror
        shell: bash
        run: |
          clang-format --version
          clang-format --dry-run -Werror $(git ls-files '*.hpp' '*.cpp')

  build:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j
      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  mysql:
    name: mysql backend (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: dataward_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -pci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install libmysqlclient
        run: sudo apt-get update && sudo apt-get install -y libmysqlclient-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDATAWARD_WITH_MYSQL=ON
      - name: Build
        run: cmake --build build -j
      - name: Test (MySQL suite live, rest too)
        env:
          DATAWARD_MYSQL_TEST: "db=dataward_test user=root password=ci host=127.0.0.1 port=3306"
          DATAWARD_MYSQL_PASSWORD: "ci"
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: sanitizers (ASan+UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure (asan preset)
        run: cmake --preset asan
      - name: Build
        run: cmake --build build/asan -j
      - name: Test under sanitizers
        env:
          # UBSan recovers by default (prints and carries on, process exits 0);
          # the preset's -fno-sanitize-recover=all is the braces, this is the belt.
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build/asan --output-on-failure
